# This file allows user to override the factory
# defaults for the WLAN Driver

# Enable IMPS or not
gEnableImps=1

# Enable/Disable Idle Scan
gEnableIdleScan=0

# Increase sleep duration (seconds) during IMPS
# 0 implies no periodic wake up from IMPS. Periodic wakeup is
# unnecessary if Idle Scan is disabled.
gImpsModSleepTime=0

# Enable suspend or not
gEnableSuspend=3

# Phy Mode (auto, b, g, n, etc)
gDot11Mode=0

# Handoff Enable(1) Disable(0)
gEnableHandoff=0

# CSR Roaming Enable(1) Disable(0)
gRoamingTime=0

# Assigned MAC Addresses - This will be used until NV items are in place
# Each byte of MAC address is represented in Hex format as XX
Intf0MacAddress=000AF58989FF
Intf1MacAddress=000AF58989FE
Intf2MacAddress=000AF58989FD
Intf3MacAddress=000AF58989FC

# UAPSD service interval for VO,VI, BE, BK traffic
InfraUapsdVoSrvIntv=0
InfraUapsdViSrvIntv=0
InfraUapsdBeSrvIntv=0
InfraUapsdBkSrvIntv=0

# Flag to allow STA send AddTspec even when ACM is Off
gAddTSWhenACMIsOff=1

# Make 1x1 the default antenna configuration
gNumRxAnt=1

# Beacon filtering frequency (unit in beacon intervals)
gNthBeaconFilter=50

# Enable WAPI or not
# WAPIIsEnabled=0

# Flags to filter Mcast abd Bcast RX packets.
# Value 0: No filtering, 1: Filter all Multicast.
# 2: Filter all Broadcast. 3: Filter all Mcast abd Bcast
McastBcastFilter=3

#Flag to enable HostARPOffload feature or not
hostArpOffload=1

#SoftAP Related Parameters
# AP MAc addr
gAPMacAddr=000AF589dcab

#Enable OBSS protection
gEnableApOBSSProt=1

#Enable/Disable UAPSD for SoftAP
gEnableApUapsd=1

# Fixed Rate
gFixedRate=0

# Maximum Tx power
# gTxPowerCap=30

# Fragmentation Threshold
# gFragmentationThreshold=2346

# RTS threshold
RTSThreshold=2347

# Intra-BSS forward
gDisableIntraBssFwd=0

# WMM Enable/Disable
WmmIsEnabled=0

# 802.11d support
g11dSupportEnabled=0

# CCX Support and fast transition
CcxEnabled=0

ImplicitQosIsEnabled=0

gNeighborScanTimerPeriod=200
gNeighborLookupThreshold=76
gNeighborReassocThreshold=81

gNeighborScanChannelMinTime=20
gNeighborScanChannelMaxTime=30
gMaxNeighborReqTries=3

# Legacy (non-CCX, non-802.11r) Fast Roaming Support
# To enable, set FastRoamEnabled=1
# To disable, set FastRoamEnabled=0
FastRoamEnabled=1

#Check if the AP to which we are roaming is better than current AP in
#terms of RSSI.  Checking is disabled if set to Zero.Otherwise it will
#use this value as to how better the RSSI of the new/roamable AP should
#be for roaming
RoamRssiDiff=5

# Enable/Disable MCC Adaptive Scheduler at the FW
# 1=Enable (default), 0=Disable
gEnableMCCAdaptiveScheduler=1

#Enable/Disable Thermal Mitigation feature
gThermalMigrationEnable=0

# Enable/Disable Modulated DTIM feature
# 0=Disable, 1=Enable
gEnableModulatedDTIM=0

#Enable/Disable Tx Frame in BMU Error scenario
gEnableTXSTBC=1

# Enable or Disable Random MAC (Spoofing)
# 1=Enable, 0=Disable (default)
gEnableMacAddrSpoof=1

# Scan Timing Parameters
# gPassiveMaxChannelTime=110
# gPassiveMinChannelTime=60
gActiveMaxChannelTime=40
gActiveMinChannelTime=20

#If set to 0, MCC is not allowed
gAllowMCCGODiffBI=1

# 1: Enable LPASS support, 0: Disable
gEnableLpassSupport=1

# 802.11K support
gRrmEnable=1
gRrmOperChanMax=8
gRrmNonOperChanMax=8
gRrmRandnIntvl=100

#Enable/Disable TDLS Feature
gEnableTDLSSupport=1

# Enable/Disable TDLS Implicit Trigger
gEnableTDLSImplicitTrigger=1

#Enable/Disable TDLS SCAN
gEnableTDLSScan=1

# 0: TDLS discovery disabled
# 1: TDLS discovery enabled
gEnableTDLSOffChannel=1

# Enable TDLS WMM in FW
gEnableTDLSWmmMode=1

# Enable or Disable MCC Channel Avoidance for SAP
# 1=Enable, 0=Disable
gMccChannelAvoidance=0

# TDLS WMM Support 1: Disabled, 0: Enabled
gEnableTDLSBufferSta=1

# 802.11h support
gEnable11hSupport=1

# PNO Support
gPNOScanSupport=1
END

# Note: Configuration parser would not read anything past the END marker
